name: Build installers

# Builds the macOS package and the Windows setup for the Kaitoi plugin for
# DaVinci Resolve, signed when the signing secrets are present, and keeps them
# as artifacts of the run. With "publish" ticked it also drafts a release in
# this repository holding both installers; a person then reviews the draft and
# publishes it. Nothing is made public by this workflow on its own.
#
# Secrets (the same names the Kaitoi CLI installers use):
#   macOS    APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
#            APPLE_NOTARY_KEY_P8, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID
#   Windows  ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: 'Fail instead of building unsigned installers'
        type: boolean
        default: true
      publish:
        description: 'Draft a release in this repository with the signed installers'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CODESIGNTOOL_VERSION: '1.3.2'
  CODESIGNTOOL_SHA256: 'f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a'
  WINDOWS_SIGNER_NAME: 'Kaitoi Labs, Inc.'
  APPLE_DEVELOPER_ID_INSTALLER: 'Developer ID Installer: Kaitoi Labs, Inc. (26NQW59397)'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check what was asked for
        env:
          PUBLISH: ${{ inputs.publish }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Said out loud, not skipped quietly: a run asked to publish that
          # cannot publish fails, so nobody waits for a draft that never comes.
          if [ "$PUBLISH" = "true" ] && [ "$REQUIRE_SIGNING" != "true" ]; then
            echo "::error::A release holds signed installers only. Tick require_signing, or untick publish for a test build."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::A release is drafted from main only; this run is on $REF."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the version can be released
        if: inputs.publish
        run: |
          set -euo pipefail
          # Before anything is signed: a version that cannot be tagged, or one
          # already tagged, would waste a signing and notarization run.
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' kaitoi_resolve/__init__.py)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "::error::__version__ in kaitoi_resolve/__init__.py is not a version this can tag."
            exit 1
          fi
          # 0: the tag is there. 2: it is not. Anything else: the question was
          # not answered, and that is not a "no".
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 || found=$?
          if [ "$found" = "0" ]; then
            echo "::error::The tag v$version already exists. Raise __version__ first."
            exit 1
          elif [ "$found" != "2" ]; then
            echo "::error::Could not check whether the tag v$version exists (git ls-remote exit $found)."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -B -m unittest discover -s tests -t .

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure macOS signing
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || missing=1
          done
          if [ "$missing" != "0" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::macOS signing secrets are missing. Add them to this repository, or run with require_signing off for an unsigned test build."
              exit 1
            fi
            echo "::warning::macOS signing secrets are missing; building an unsigned package."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/kaitoi-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/kaitoi-signing.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-certificate -a -c "Developer ID Installer" -Z "$KEYCHAIN_PATH" >/dev/null

          xcrun notarytool store-credentials kaitoi-notary \
            --key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Test the packaging
        # The package layout and the step that runs after an install can only
        # be tested on a Mac; the test job above runs on Linux and skips them.
        run: python3 -B -m unittest tests.test_offline.Installer tests.test_offline.AfterTheMacInstall

      - name: Build the package
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_ENABLED" = "true" ]; then
            export APPLE_NOTARY_PROFILE="kaitoi-notary" MACOS_REQUIRE_SIGNING=1 MACOS_REQUIRE_NOTARIZATION=1
          else
            unset APPLE_DEVELOPER_ID_INSTALLER
          fi
          packaging/macos/build-pkg.sh

      - name: Check the package
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          pkg="$(ls dist/*.pkg)"
          # Only Kaitoi's own folder: an installer resets the permissions of every folder a package carries.
          packaging/macos/check-payload.sh "$pkg"
          if [ "$SIGNING_ENABLED" = "true" ]; then
            pkgutil --check-signature "$pkg"
            spctl --assess --type install --verbose=2 "$pkg"
          fi

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/kaitoi-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/kaitoi-signing.p12" "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: kaitoi-resolve-macos${{ steps.signing.outputs.enabled != 'true' && '-unsigned' || '' }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure Windows signing
        id: signing
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: |
          set -euo pipefail
          missing=0
          for name in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
            [ -n "${!name}" ] || missing=1
          done
          if [ "$missing" != "0" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::Windows signing secrets are missing. Add them to this repository, or run with require_signing off for an unsigned test build."
              exit 1
            fi
            echo "::warning::Windows signing secrets are missing; building an unsigned setup."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # sign-file.ps1 strips whitespace from the TOTP seed; mask that form
          # too, since GitHub only masks the secret exactly as stored.
          echo "::add-mask::$(printf '%s' "$ES_TOTP_SECRET" | LC_ALL=C tr -d '[:space:]')"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java for CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install CodeSignTool
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $toolDir = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/v$env:CODESIGNTOOL_VERSION/CodeSignTool-v$env:CODESIGNTOOL_VERSION.zip" -OutFile $zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:CODESIGNTOOL_SHA256) { throw "CodeSignTool archive checksum mismatch" }
          Expand-Archive -Path $zip -DestinationPath $toolDir
          $jar = Join-Path $toolDir "jar\code_sign_tool-$env:CODESIGNTOOL_VERSION.jar"
          if (-not (Test-Path -LiteralPath $jar)) { throw "CodeSignTool jar not found at $jar" }
          "CODESIGNTOOL_DIR=$toolDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CODESIGNTOOL_JAR=$jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build the setup
        timeout-minutes: 30
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $version = (Select-String -Path kaitoi_resolve/__init__.py -Pattern '^__version__ = "(.*)"$').Matches[0].Groups[1].Value
          if (-not $version) { throw "no __version__ in kaitoi_resolve/__init__.py" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $iss = "packaging/windows/kaitoi-resolve.iss"
          if ($env:SIGNING_ENABLED -eq "true") {
            # ISCC runs the sign tool from its own directory, so the script
            # path is absolute. $q is a quote and $f the quoted file name.
            $signScript = (Resolve-Path "packaging/windows/sign-file.ps1").Path
            & $iscc "/DMyAppVersion=$version" "/DKAITOI_SIGN" "/Skaitoisign=pwsh -NoProfile -NonInteractive -File `$q$signScript`$q -Path `$f" $iss
          } else {
            & $iscc "/DMyAppVersion=$version" $iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the signed setup
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-Setup.exe)[0].FullName
          ./packaging/windows/sign-file.ps1 -Path $setup -VerifyOnly

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: kaitoi-resolve-windows${{ steps.signing.outputs.enabled != 'true' && '-unsigned' || '' }}
          path: dist/*
          if-no-files-found: error

  release:
    # Only signed installers are ever attached to a release.
    if: inputs.publish && inputs.require_signing
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # One at a time, so two runs cannot both find no release and both draft one.
    concurrency:
      group: kaitoi-resolve-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: kaitoi-resolve-macos
          path: release/macos

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: kaitoi-resolve-windows
          path: release/windows

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' kaitoi_resolve/__init__.py)"
          [ -n "$version" ] || { echo "::error::no __version__ in kaitoi_resolve/__init__.py"; exit 1; }
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "::error::__version__ is not a version this can tag."
            exit 1
          fi
          # Checked here as well as at the start: only this job may see a draft.
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 || found=$?
          if [ "$found" = "0" ]; then
            echo "::error::The tag v$version already exists. Raise __version__ first."
            exit 1
          elif [ "$found" != "2" ]; then
            echo "::error::Could not check whether the tag v$version exists (git ls-remote exit $found)."
            exit 1
          fi
          if answer="$(gh release view "v$version" 2>&1)"; then
            echo "::error::A release v$version already exists. Raise __version__ first, or delete that draft."
            exit 1
          elif ! printf '%s' "$answer" | grep -qi "release not found"; then
            echo "::error::Could not check whether a release v$version exists: $answer"
            exit 1
          fi
          mkdir -p out
          # One name that never changes, so a link on kaitoi.io to
          # releases/latest/download/<name> always fetches the newest.
          cp release/macos/*.pkg "out/Kaitoi-for-DaVinci-Resolve-macOS.pkg"
          cp release/windows/*-Setup.exe "out/Kaitoi-for-DaVinci-Resolve-Windows-Setup.exe"
          (cd out && sha256sum * > checksums.txt)
          gh release create "v$version" out/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Kaitoi for DaVinci Resolve $version" \
            --notes "Installers for macOS and Windows. Both are signed by Kaitoi Labs, Inc.; the macOS package is notarized by Apple. After installing, restart DaVinci Resolve and open Workspace > Scripts > Edit > Kaitoi."

